name: gates
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: ffmpeg (self-test doctor requires ffmpeg/ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: gate tests
        shell: bash
        run: |
          set -o pipefail
          python tests/run_gates.py 2>&1 | tee gate.log
      - name: retain gate ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-ledger-${{ github.run_id }}
          path: |
            gate.log
            docs/CANON_AND_NONLANDING_LEDGER.md
            docs/canon/canon-ledger.v1.json
            docs/canon/canon-ledger.v1.corrections.json
            schemas/earcrate_canon_and_nonlanding_ledger_v1.schema.json
            schemas/earcrate_canon_ledger_corrections_v1.schema.json
          if-no-files-found: error
          retention-days: 30
      - name: package verifier (gate suite already passed above)
        shell: bash
        run: |
          set -o pipefail
          python VERIFY_PACKAGE.py --skip-gates 2>&1 | tee package-verifier.log
      - name: retain package verifier ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-verifier-${{ github.run_id }}
          path: package-verifier.log
          if-no-files-found: error
          retention-days: 30

  reconcile-pr52:
    name: reconcile PR #52 into canon
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'agent/canon-nonlanding-ledger'
    needs: gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/canon-nonlanding-ledger
          fetch-depth: 0
          persist-credentials: true
      - name: Reseal and push terminal canon
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(git log -1 --format=%s)" != "Run canon reconciliation after PR #52" ]; then
            echo "Current branch head is not the one-shot reconciliation trigger; nothing to do."
            exit 0
          fi

          python .github/reseal_canon_after_pr52.py
          python - <<'PY'
          from __future__ import annotations
          import inspect
          from pathlib import Path
          import sys

          root = Path.cwd()
          sys.path.insert(0, str(root / "tests"))
          import test_canon_ledger

          cases = [
              (name, fn)
              for name, fn in sorted(vars(test_canon_ledger).items())
              if name.startswith("test_") and callable(fn)
          ]
          if not cases:
              raise RuntimeError("no canon ledger tests discovered")
          for name, fn in cases:
              if inspect.signature(fn).parameters:
                  raise RuntimeError(f"unsupported canon test fixture: {name}")
              fn()
              print(f"PASS {name}")
          print(f"SUMMARY {len(cases)}/{len(cases)} canon ledger tests passed")
          PY

          git diff --check
          expected=$(cat <<'EOF'
          docs/CANON_AND_NONLANDING_LEDGER.md
          docs/canon/canon-ledger.v1.corrections.json
          docs/canon/canon-ledger.v1.json
          tests/test_canon_ledger.py
          EOF
          )
          actual=$(git diff --name-only | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sed 's/^ *//' | sort)"

          git config user.name "EarCrate Canon Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            docs/CANON_AND_NONLANDING_LEDGER.md \
            docs/canon/canon-ledger.v1.json \
            docs/canon/canon-ledger.v1.corrections.json \
            tests/test_canon_ledger.py
          git commit -m "Record PR #52 as landed canon"
          git push origin HEAD:agent/canon-nonlanding-ledger
