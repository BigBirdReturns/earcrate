name: Apply Children continuation embedding

on:
  push:
    branches:
      - agent/children-buffalo-gate

permissions:
  contents: write

concurrency:
  group: children-continuation-embedding
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[children-continuation-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/children-buffalo-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Apply exact standalone embedding repair
        run: python .gate8/apply_children_continuation_embedding.py
      - name: Verify continuation organ
        run: |
          set -o pipefail
          python -m pytest -q tests/test_children_continuation.py tests/test_buffalo_specimen.py 2>&1 | tee children-continuation-bootstrap.log
          python build/make_singlefile.py
          python dist/earcrate.py buffalo capability
          python scripts/oss_audit.py
          git diff --check
      - name: Retain focused ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: children-continuation-bootstrap-${{ github.run_id }}
          path: children-continuation-bootstrap.log
          if-no-files-found: warn
          retention-days: 30
      - name: Commit integrated continuation organ
        run: |
          rm -f children-continuation-bootstrap.log
          git config user.name "EarCrate Children continuation integration"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "Add proof-carrying Children adjacent move and negative control"
          git push origin HEAD:agent/children-buffalo-gate
