name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Detect verified factory transport
        id: probe
        shell: bash
        run: |
          if [[ -f .factory-payload/part-000 ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruct ordinary factory source
        if: steps.probe.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import os
          import stat
          import zipfile

          root = Path('.').resolve()
          paths = sorted((root / '.factory-payload').glob('part-*'))
          if not paths:
              raise SystemExit('factory payload has no parts')
          pieces = [''.join(path.read_text(encoding='ascii').split()) for path in paths]
          names = [path.name for path in paths]
          try:
              insertion_index = names.index('part-015')
          except ValueError as exc:
              raise SystemExit('factory payload is missing part-015') from exc
          recovered = 'Mx8Cyps8DzYmBqNUcSlsaeoGNuXAijtww8'
          part = pieces[insertion_index]
          pieces[insertion_index] = part[:16] + recovered + part[16:]
          encoded = ''.join(pieces)
          data = base64.b64decode(encoded + '=' * (-len(encoded) % 4), validate=True)
          expected = '81287ffc7a9110b2324d8ab3152ab8efa3a6c5cf6d49a4a06a653666c890dcf1'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'factory payload SHA-256 mismatch: expected {expected}, computed {actual}')
          print('factory payload restored and verified against sealed SHA-256')

          payload = Path('/tmp/factory-payload.zip')
          with payload.open('wb') as handle:
              handle.write(data)
              handle.flush()
              os.fsync(handle.fileno())

          with zipfile.ZipFile(payload) as archive:
              member_names = [item.filename for item in archive.infolist()]
              if len(member_names) != len(set(member_names)):
                  raise SystemExit('duplicate payload member')
              bad_member = archive.testzip()
              if bad_member is not None:
                  raise SystemExit(f'factory payload CRC failure: {bad_member}')
              for item in archive.infolist():
                  name = item.filename.replace('\\', '/')
                  if name.startswith('/') or ':' in name.split('/')[0] or '..' in Path(name).parts:
                      raise SystemExit(f'unsafe payload path: {name}')
                  mode = (item.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink payload member refused: {name}')
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'payload escaped repository: {name}')
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  temporary = target.with_name(f'.{target.name}.factory-materialize.tmp')
                  with temporary.open('wb') as handle:
                      handle.write(archive.read(item))
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.replace(temporary, target)
                  if mode:
                      target.chmod(mode & 0o777)
          PY
          rm -rf .factory-payload .github/workflows/materialize-homelab-factory.yml
      - name: Validate materialized factory
        if: steps.probe.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check pytest -r requirements.txt
          python -m py_compile \
            earcrate/estate/homelab_common.py \
            earcrate/estate/homelab_specimens.py \
            earcrate/estate/homelab_factory.py \
            scripts/earcrate_cloud_intake.py \
            scripts/earcrate_factory.py \
            scripts/beggin_timing_pass.py \
            build/make_homelab_factory_zipapp.py
          python -m pytest -q \
            tests/test_homelab_factory.py \
            tests/test_homelab_cloud_specimens.py \
            tests/test_beggin_timing_pass.py
          python build/make_homelab_factory_zipapp.py --output /tmp/factory-a.pyz
          python build/make_homelab_factory_zipapp.py --output /tmp/factory-b.pyz
          cmp /tmp/factory-a.pyz /tmp/factory-b.pyz
          python /tmp/factory-a.pyz --help
          git diff --check
      - name: Commit ordinary source and remove transport residue
        id: commit
        if: steps.probe.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "earcrate-factory-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "materializer produced no change"; exit 1; }
          git commit -m "add runnable Homelab organ factory"
          git push origin HEAD:${{ github.head_ref }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

  gates:
    needs: materialize-factory
    if: always() && needs.materialize-factory.result == 'success' && needs.materialize-factory.outputs.changed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: ffmpeg (self-test doctor requires ffmpeg/ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Gate tests
        shell: bash
        run: |
          set -o pipefail
          python tests/run_gates.py 2>&1 | tee gate.log
      - name: Retain gate ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-ledger-${{ github.run_id }}
          path: |
            gate.log
            docs/CANON_AND_NONLANDING_LEDGER.md
            docs/CANON_AND_CAMPAIGN_V2.md
            docs/BRANCH_RETENTION_MAP.md
            docs/canon/canon-ledger.v1.json
            docs/canon/canon-ledger.v1.corrections.json
            docs/canon/canon-ledger.v2.json
            schemas/earcrate_canon_and_nonlanding_ledger_v1.schema.json
            schemas/earcrate_canon_ledger_corrections_v1.schema.json
            schemas/earcrate_canon_and_nonlanding_ledger_v2.schema.json
          if-no-files-found: error
          retention-days: 30
      - name: Package verifier (gate suite already passed above)
        shell: bash
        run: |
          set -o pipefail
          python VERIFY_PACKAGE.py --skip-gates 2>&1 | tee package-verifier.log
      - name: Retain package verifier ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-verifier-${{ github.run_id }}
          path: package-verifier.log
          if-no-files-found: error
          retention-days: 30
