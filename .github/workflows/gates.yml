name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: ffmpeg (self-test doctor requires ffmpeg/ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest -r requirements.txt
      - name: Album Sprint executable preflight
        shell: bash
        run: |
          set -o pipefail
          python scripts/earcrate_album_sprint_preflight.py > album-sprint-preflight.json
          cat album-sprint-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("album-sprint-preflight.json").read_text(encoding="utf-8"))
          assert report["music_producing_lane_count"] == 0
          assert report["performance_realization_ready_count"] == 0
          assert report["estate_execution_authorized"] is False
          assert report["authorized_track_ids"] == []
          assert report["bindings_bytes_verified"] is False
          assert report["tracks"]["A1-03"]["symbolic_evidence_ready"] is True
          assert report["tracks"]["A1-03"]["performance_realization_ready"] is False
          PY
      - name: Gate tests
        shell: bash
        run: |
          set -o pipefail
          python tests/run_gates.py 2>&1 | tee gate.log
      - name: Retain gate ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-ledger-${{ github.run_id }}
          path: |
            gate.log
            album-sprint-preflight.json
            docs/CANON_AND_NONLANDING_LEDGER.md
            docs/CANON_AND_CAMPAIGN_V2.md
            docs/BRANCH_RETENTION_MAP.md
            docs/canon/canon-ledger.v1.json
            docs/canon/canon-ledger.v1.corrections.json
            docs/canon/canon-ledger.v2.json
            schemas/earcrate_canon_and_nonlanding_ledger_v1.schema.json
            schemas/earcrate_canon_ledger_corrections_v1.schema.json
            schemas/earcrate_canon_and_nonlanding_ledger_v2.schema.json
          if-no-files-found: error
          retention-days: 30
      - name: Package verifier (gate suite already passed above)
        shell: bash
        run: |
          set -o pipefail
          python VERIFY_PACKAGE.py --skip-gates 2>&1 | tee package-verifier.log
      - name: Retain package verifier ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-verifier-${{ github.run_id }}
          path: package-verifier.log
          if-no-files-found: error
          retention-days: 30
