name: Apply release-candidate Floor

on:
  push:
    branches:
      - agent/release-candidate-discipline

permissions:
  contents: write

concurrency:
  group: release-candidate-floor-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[release-floor-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-candidate-discipline
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Apply exact content-addressed source payload
        run: python .release-floor-bootstrap/apply.py
      - name: Verify release authority and standalone surface
        run: |
          set -o pipefail
          python -m pytest -q tests/test_floor_release.py tests/test_floor_protocol.py 2>&1 | tee release-floor-bootstrap.log
          python -m earcrate floor capability
          python build/make_singlefile.py
          python dist/earcrate.py floor capability
          python VERIFY_PACKAGE.py --skip-gates
          python scripts/oss_audit.py
          git diff --check
      - name: Retain focused bootstrap ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-floor-bootstrap-${{ github.run_id }}
          path: release-floor-bootstrap.log
          if-no-files-found: warn
          retention-days: 30
      - name: Commit ordinary review tree
        run: |
          rm -f release-floor-bootstrap.log
          git config user.name "EarCrate release-floor integration"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "Add release-candidate review discipline"
          git push origin HEAD:agent/release-candidate-discipline
