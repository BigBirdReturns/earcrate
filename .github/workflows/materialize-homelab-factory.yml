name: Materialize Homelab factory transport

on:
  push:
    branches:
      - agent/homelab-audition-telemetry-20260808
    paths:
      - ".factory-payload/**"
      - ".github/workflows/materialize-homelab-factory.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct and verify ordinary source tree
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import os
          import stat
          import zipfile

          root = Path('.').resolve()
          parts = sorted((root / '.factory-payload').glob('part-*'))
          if not parts:
              raise SystemExit('factory payload has no parts')
          encoded = ''.join(''.join(path.read_text(encoding='ascii').split()) for path in parts)
          encoded += '=' * (-len(encoded) % 4)
          data = base64.b64decode(encoded, validate=True)
          expected = '81287ffc7a9110b2324d8ab3152ab8efa3a6c5cf6d49a4a06a653666c890dcf1'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'factory payload SHA-256 mismatch: expected {expected}, computed {actual}')
          payload = Path('/tmp/factory-payload.zip')
          with payload.open('wb') as handle:
              handle.write(data)
              handle.flush()
              os.fsync(handle.fileno())

          with zipfile.ZipFile(payload) as archive:
              names = [item.filename for item in archive.infolist()]
              if len(names) != len(set(names)):
                  raise SystemExit('duplicate payload member')
              for item in archive.infolist():
                  name = item.filename.replace('\\', '/')
                  if name.startswith('/') or ':' in name.split('/')[0] or '..' in Path(name).parts:
                      raise SystemExit(f'unsafe payload path: {name}')
                  mode = (item.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f'symlink payload member refused: {name}')
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'payload escaped repository: {name}')
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  temporary = target.with_name(f'.{target.name}.factory-materialize.tmp')
                  with temporary.open('wb') as handle:
                      handle.write(archive.read(item))
                      handle.flush()
                      os.fsync(handle.fileno())
                  os.replace(temporary, target)
                  if mode:
                      target.chmod(mode & 0o777)
          PY
          rm -rf .factory-payload .github/workflows/materialize-homelab-factory.yml
      - name: Validate the materialized factory
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pytest numpy scipy soundfile
          python -m py_compile \
            earcrate/estate/homelab_common.py \
            earcrate/estate/homelab_specimens.py \
            earcrate/estate/homelab_factory.py \
            scripts/earcrate_cloud_intake.py \
            scripts/earcrate_factory.py \
            scripts/beggin_timing_pass.py \
            build/make_homelab_factory_zipapp.py
          python -m pytest -q \
            tests/test_homelab_factory.py \
            tests/test_homelab_cloud_specimens.py \
            tests/test_beggin_timing_pass.py
          python build/make_homelab_factory_zipapp.py --output /tmp/factory-a.pyz
          python build/make_homelab_factory_zipapp.py --output /tmp/factory-b.pyz
          cmp /tmp/factory-a.pyz /tmp/factory-b.pyz
          python /tmp/factory-a.pyz --help
          git diff --check
      - name: Commit the ordinary source and remove transport residue
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "earcrate-factory-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "materializer produced no change"; exit 1; }
          git commit -m "add runnable Homelab organ factory"
          git push origin HEAD:agent/homelab-audition-telemetry-20260808
