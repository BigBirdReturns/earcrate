name: Apply Floor core

on:
  pull_request:
    branches:
      - agent/children-buffalo-gate
    types: [opened, reopened, synchronize]
    paths:
      - ".floor-bootstrap/**"
      - ".github/workflows/apply-floor-core.yml"

permissions:
  contents: write

concurrency:
  group: floor-core-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/open-music-evidence-floor'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/open-music-evidence-floor
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Materialize core protocol
        run: python .floor-bootstrap/apply.py
      - name: Verify core protocol
        run: |
          python -m compileall -q earcrate/floor
          python -m earcrate.floor capability
          python -m earcrate.floor demo build/floor-core-demo
          git diff --check
      - name: Commit core protocol
        run: |
          rm -rf build/floor-core-demo
          git config user.name "EarCrate Floor integration"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "Add Open Music Evidence Floor core"
          git push origin HEAD:agent/open-music-evidence-floor
