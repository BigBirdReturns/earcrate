name: apply-homelab-integrity-overlay

on:
  push:
    branches: [agent/homelab-integrity-transport]
    paths:
      - ".github/workflows/homelab-integrity-transport.yml"

permissions:
  contents: write

concurrency:
  group: homelab-integrity-transport
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Preserve and apply verified overlay
        shell: bash
        run: |
          set -euo pipefail
          cp -R .homelab-integrity-transport "$RUNNER_TEMP/transport"
          git reset --hard 109ffa6f2f41d0fb31506aae7a1c23840be1edbb
          python "$RUNNER_TEMP/transport/apply.py" \
            --chunks "$RUNNER_TEMP/transport" \
            --repo . \
            --expected-head 109ffa6f2f41d0fb31506aae7a1c23840be1edbb
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Verify focused integrity and Homelab surfaces
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q earcrate/estate
          python -m pytest -q \
            tests/test_local_estate.py \
            tests/test_homelab_provider_arcade.py \
            tests/test_homelab_operations.py \
            tests/test_homelab_public_projection.py \
            tests/test_homelab_integrity.py
          python VERIFY_HOMELAB.py
          git diff --check
      - name: Commit one clean production change
        shell: bash
        run: |
          set -euo pipefail
          expected=$(cat <<'EOF'
          earcrate/estate/__init__.py
          earcrate/estate/homelab.py
          earcrate/estate/homelab_cli.py
          earcrate/estate/homelab_common.py
          earcrate/estate/homelab_review.py
          earcrate/estate/markers.py
          schemas/earcrate_homelab_v1.schema.json
          tests/test_homelab_integrity.py
          EOF
          )
          actual=$(git diff --name-only | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sed 's/^ *//' | sort)"
          git config user.name "EarCrate Homelab Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            earcrate/estate/__init__.py \
            earcrate/estate/homelab.py \
            earcrate/estate/homelab_cli.py \
            earcrate/estate/homelab_common.py \
            earcrate/estate/homelab_review.py \
            earcrate/estate/markers.py \
            schemas/earcrate_homelab_v1.schema.json \
            tests/test_homelab_integrity.py
          git commit -m "Bind fixture bytes and harden blind audition evidence"
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$(printf '%s\n' "$expected" | sed 's/^ *//' | sort)"
          git push origin HEAD:agent/local-estate-control-plane
