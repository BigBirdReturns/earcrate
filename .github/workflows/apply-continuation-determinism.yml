name: Apply Children continuation determinism repair

on:
  push:
    branches:
      - agent/children-buffalo-gate

permissions:
  contents: write

concurrency:
  group: children-continuation-determinism
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[continuation-determinism-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/children-buffalo-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Apply PCM-identity repair
        run: python .gate8/fix_children_continuation_determinism.py
      - name: Verify deterministic continuation
        run: |
          set -o pipefail
          python -m pytest -q tests/test_children_continuation.py 2>&1 | tee continuation-determinism.log
          python build/make_singlefile.py
          python dist/earcrate.py buffalo capability
          git diff --check
      - name: Retain focused ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuation-determinism-${{ github.run_id }}
          path: continuation-determinism.log
          if-no-files-found: warn
          retention-days: 30
      - name: Commit repair
        run: |
          rm -f continuation-determinism.log
          git config user.name "EarCrate continuation determinism"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "Use decoded PCM identity for deterministic continuation receipts"
          git push origin HEAD:agent/children-buffalo-gate
