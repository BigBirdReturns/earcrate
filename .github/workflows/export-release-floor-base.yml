name: Apply reviewed release-candidate gate

on:
  push:
    branches:
      - agent/release-candidate-review-gate

permissions:
  contents: write

concurrency:
  group: release-candidate-review-gate
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[release-candidate-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-candidate-review-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Apply and verify reviewed release-candidate gate
        run: |
          set -o pipefail
          python .release-candidate-bootstrap/apply.py 2>&1 | tee release-candidate-bootstrap.log
      - name: Retain integration ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-bootstrap-${{ github.run_id }}
          path: release-candidate-bootstrap.log
          if-no-files-found: warn
          retention-days: 30
