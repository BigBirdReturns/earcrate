name: Materialize production cleanup

on:
  push:
    branches:
      - agent/production-cleanup-bootstrap
    paths:
      - ".production-cleanup-bootstrap/**"
      - ".github/workflows/apply-production-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: agent/production-cleanup-bootstrap
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Apply and verify content-addressed cleanup patch
        run: python .production-cleanup-bootstrap/apply.py

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Verify repository, distribution, and core authority surfaces
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q earcrate tests scripts
          python scripts/repo_hygiene.py
          python scripts/oss_audit.py
          python scripts/verify_distribution.py
          python -m pytest -q \
            tests/test_gate_runner.py \
            tests/test_floor_protocol.py \
            tests/test_floor_release_gate.py \
            tests/test_floor_release_governance_v2.py \
            tests/test_floor_release_governance_v2_packaging.py \
            tests/test_workspace_pointer_isolation.py \
            2>&1 | tee production-focused.log
          python VERIFY_PACKAGE.py --skip-gates 2>&1 | tee production-package.log

      - name: Create single clean production commit
        id: clean
        shell: bash
        env:
          CLEAN_PARENT: 46411c3fc32e8af17e8b9b9cf32cb3de41fe3837
          EXPECTED_TREE: 80dbddd4884f931ca2a1c86d3990487e1d65db5b
        run: |
          set -euo pipefail
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$EXPECTED_TREE"
          git cat-file -e "$CLEAN_PARENT^{commit}"
          git config user.name "EarCrate production integration"
          git config user.email "noreply@github.com"
          export GIT_AUTHOR_NAME="EarCrate production integration"
          export GIT_AUTHOR_EMAIL="noreply@github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          clean_commit="$({
            printf '%s\n\n' 'Productionize EarCrate repository and release governance'
            printf '%s\n' 'Replace experimental repository residue with an installable, content-addressed, production-tested distribution and hardened release/publication authority.'
          } | git commit-tree "$actual_tree" -p "$CLEAN_PARENT")"
          git push --force origin "$clean_commit:refs/heads/agent/production-cleanup-result"
          printf '%s\n' "$clean_commit" | tee CLEAN_COMMIT.txt
          echo "commit=$clean_commit" >> "$GITHUB_OUTPUT"

      - name: Retain production verification ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-cleanup-${{ github.run_id }}
          path: |
            production-focused.log
            production-package.log
            CLEAN_COMMIT.txt
          if-no-files-found: warn
          retention-days: 30
