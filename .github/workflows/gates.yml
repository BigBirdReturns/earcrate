name: gates
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Export exact release-candidate base tree
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path('.')
          out = Path('earcrate-release-base.zip')
          skip = {'.git', '.pytest_cache', '__pycache__'}
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or path == out:
                      continue
                  if any(part in skip for part in path.parts):
                      continue
                  zf.write(path, path.as_posix())
          print(out, out.stat().st_size)
          PY
      - name: Retain exact release-candidate base tree
        uses: actions/upload-artifact@v4
        with:
          name: earcrate-release-base-${{ github.run_id }}
          path: earcrate-release-base.zip
          if-no-files-found: error
          retention-days: 2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ffmpeg (self-test doctor requires ffmpeg/ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: gate tests
        shell: bash
        run: |
          set -o pipefail
          python tests/run_gates.py 2>&1 | tee gate.log
      - name: retain gate ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-ledger-${{ github.run_id }}
          path: gate.log
          if-no-files-found: error
          retention-days: 30
      - name: package verifier (gate suite already passed above)
        shell: bash
        run: |
          set -o pipefail
          python VERIFY_PACKAGE.py --skip-gates 2>&1 | tee package-verifier.log
      - name: retain package verifier ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-verifier-${{ github.run_id }}
          path: package-verifier.log
          if-no-files-found: error
          retention-days: 30
