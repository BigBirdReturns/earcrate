name: Generative provider floor

on:
  pull_request:
    paths:
      - "earcrate/generative_floor/**"
      - "scripts/earcrate_generative_floor.py"
      - "scripts/RUN_GENERATIVE_FLOOR.ps1"
      - "scripts/RUN_GENERATIVE_FLOOR.cmd"
      - "configs/generative_floor/**"
      - "schemas/earcrate_generative_floor_v1.schema.json"
      - "docs/GENERATIVE_PROVIDER_FLOOR.md"
      - "tests/test_generative_floor.py"
      - "tests/test_midi_sag_floor.py"
      - ".github/workflows/generative-floor.yml"
  push:
    branches: [main]
    paths:
      - "earcrate/generative_floor/**"
      - "scripts/earcrate_generative_floor.py"
      - "scripts/RUN_GENERATIVE_FLOOR.ps1"
      - "scripts/RUN_GENERATIVE_FLOOR.cmd"
      - "configs/generative_floor/**"
      - "schemas/earcrate_generative_floor_v1.schema.json"
      - "docs/GENERATIVE_PROVIDER_FLOOR.md"
      - "tests/test_generative_floor.py"
      - "tests/test_midi_sag_floor.py"
      - ".github/workflows/generative-floor.yml"

permissions:
  contents: read

jobs:
  generative-floor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared repository dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check pytest -r requirements.txt
      - name: Compile floor and Reference Zero integration
        run: >-
          python -m py_compile
          earcrate/generative_floor/core.py
          earcrate/generative_floor/catalog.py
          earcrate/generative_floor/execution.py
          earcrate/generative_floor/cli.py
          earcrate/generative_floor/__init__.py
          earcrate/reference_zero.py
          scripts/earcrate_generative_floor.py
          tests/test_midi_sag_floor.py
      - name: Run focused floor tests
        run: python -m pytest -q tests/test_generative_floor.py tests/test_midi_sag_floor.py
      - name: Exercise CLI and sealed catalog
        shell: bash
        run: |
          python scripts/earcrate_generative_floor.py validate-catalog \
            --catalog configs/generative_floor/providers.v1.json
          python scripts/earcrate_generative_floor.py --help
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path('schemas/earcrate_generative_floor_v1.schema.json').read_text(encoding='utf-8'))
          campaign = json.loads(Path('configs/generative_floor/beggin-suno-bones.v1.json').read_text(encoding='utf-8'))
          assert schema['$id']
          assert len(campaign['tasks']) == 12
          PY
      - name: Exercise one-command Windows capability pass
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts\RUN_GENERATIVE_FLOOR.ps1 `
            -Workspace "build\generative-probe-${{ matrix.python }}" `
            -ProbeOnly
          $plan = Get-Content -LiteralPath "build\generative-probe-${{ matrix.python }}\generation-campaign.json" -Raw | ConvertFrom-Json
          if ($plan.summary.tasks -ne 12) { throw "Expected 12 tasks, got $($plan.summary.tasks)" }
          if (-not (Test-Path -LiteralPath "build\generative-probe-${{ matrix.python }}\LOCAL_NEXT_ACTIONS.md")) { throw "Missing local next actions" }
