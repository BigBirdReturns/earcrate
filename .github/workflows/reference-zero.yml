name: Reference Zero

on:
  pull_request:
    paths:
      - "earcrate/reference_zero.py"
      - "scripts/earcrate_reference_zero.py"
      - "scripts/RUN_REFERENCE_ZERO.ps1"
      - "scripts/PREPARE_BEGGIN_REFERENCE_ZERO.ps1"
      - "schemas/earcrate_performance_score_v1.schema.json"
      - "configs/reference_zero/**"
      - "docs/REFERENCE_ZERO.md"
      - "tests/test_reference_zero.py"
      - ".github/workflows/reference-zero.yml"
  push:
    branches: [main]
    paths:
      - "earcrate/reference_zero.py"
      - "scripts/earcrate_reference_zero.py"
      - "scripts/RUN_REFERENCE_ZERO.ps1"
      - "scripts/PREPARE_BEGGIN_REFERENCE_ZERO.ps1"
      - "schemas/earcrate_performance_score_v1.schema.json"
      - "configs/reference_zero/**"
      - "docs/REFERENCE_ZERO.md"
      - "tests/test_reference_zero.py"
      - ".github/workflows/reference-zero.yml"

permissions:
  contents: read

jobs:
  reference-zero:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg librubberband2
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          ffmpeg -version
          ffprobe -version
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile Reference Zero
        run: python -m py_compile earcrate/reference_zero.py scripts/earcrate_reference_zero.py tests/test_reference_zero.py
      - name: Run Reference Zero tests
        run: python -m pytest -q tests/test_reference_zero.py
      - name: CLI smoke
        run: python scripts/earcrate_reference_zero.py --help
