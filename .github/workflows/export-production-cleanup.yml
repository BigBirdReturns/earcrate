name: Export production cleanup source

on:
  push:
    branches:
      - codex/spark-governance-v2-20260729
    paths:
      - ".github/workflows/export-production-cleanup.yml"
      - ".production-cleanup-trigger"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/spark-governance-v2-20260729
          fetch-depth: 1
      - name: Build exact source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=earcrate-production-cleanup-source.zip HEAD
          sha256sum earcrate-production-cleanup-source.zip > earcrate-production-cleanup-source.zip.sha256
          git rev-parse HEAD > SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: earcrate-production-cleanup-source-${{ github.run_id }}
          path: |
            earcrate-production-cleanup-source.zip
            earcrate-production-cleanup-source.zip.sha256
            SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 1
