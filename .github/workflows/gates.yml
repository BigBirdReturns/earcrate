name: gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: ffmpeg (self-test doctor requires ffmpeg/ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Gate tests
        shell: bash
        run: |
          set -o pipefail
          python tests/run_gates.py 2>&1 | tee gate.log
      - name: Retain gate ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-ledger-${{ github.run_id }}
          path: gate.log
          if-no-files-found: error
          retention-days: 30
      - name: Package verifier (gate suite already passed above)
        shell: bash
        run: |
          set -o pipefail
          python VERIFY_PACKAGE.py --skip-gates 2>&1 | tee package-verifier.log
      - name: Retain package verifier ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-verifier-${{ github.run_id }}
          path: package-verifier.log
          if-no-files-found: error
          retention-days: 30
