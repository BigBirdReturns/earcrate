name: Apply Children Buffalo Gate

on:
  push:
    branches:
      - agent/children-buffalo-gate

permissions:
  contents: write

concurrency:
  group: children-buffalo-gate-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[children-buffalo-bootstrap]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/children-buffalo-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Apply content-addressed specimen payload
        run: python .gate8/apply_children_buffalo_payload.py
      - name: Verify cross-organ authority
        run: |
          python -m pytest -q tests/test_buffalo_specimen.py tests/test_mixscore.py
          python build/make_singlefile.py
          python -m earcrate buffalo capability
          python -m earcrate mix capability
          python dist/earcrate.py buffalo capability
          python dist/earcrate.py mix capability
          python scripts/oss_audit.py
          git diff --check
      - name: Refuse bundled source media
        shell: bash
        run: |
          if git status --short | awk '{print $2}' | grep -E '\.(aac|aif|aiff|alac|flac|m4a|mid|midi|mp3|ogg|opus|pdf|wav|wma)$'; then
            echo 'source media entered the proposed commit' >&2
            exit 1
          fi
      - name: Commit integrated organism
        run: |
          git config user.name "EarCrate Buffalo Gate integration"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "Add Children cross-organ specimen authority"
          git push origin HEAD:agent/children-buffalo-gate
